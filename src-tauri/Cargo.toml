[package]
name = "auto-transcript"
version = "0.1.0"
description = "Live meeting transcription for macOS"
edition = "2021"
rust-version = "1.80"

[lib]
name = "auto_transcript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures-util = "0.3"

cpal = "0.18"
rubato = "0.16"
ringbuf = "0.5"
hound = "3.5"
crossbeam-channel = "0.5"

rusqlite = { version = "0.40", features = ["bundled", "functions"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "http2", "charset", "stream"] }
sha2 = "0.11"
hex = "0.4"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = "0.4"

# Akselerasi berbeda per platform. Metal ada di setiap Mac, jadi bisa dipakai tanpa
# syarat. Di Windows, Vulkan dinyalakan lewat fitur opsional `gpu-vulkan` karena ia
# menuntut Vulkan SDK terpasang saat build — tanpa itu, build gagal. Default Windows
# adalah CPU: lebih lambat, tapi selalu bisa dibangun.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

[features]
default = []
gpu-vulkan = ["whisper-rs/vulkan"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
