name: Release

on:
  push:
    tags: ["v*"]
  # Lets you re-run a release for a tag that already exists, after fixing a broken build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.1.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The version lives in four places. A tag that disagrees with them produces installers
  # whose About box contradicts the release they are attached to, so refuse early rather
  # than after three slow platform builds.
  verify:
    name: Version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Compare tag against the manifests
        run: |
          want="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          for got in "$pkg" "$conf" "$cargo"; do
            if [ "$got" != "$want" ]; then
              echo "::error::Tag $TAG does not match version $got in the manifests."
              exit 1
            fi
          done

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-14
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Signing is optional, but "optional" has to mean the variables are absent, not
      # empty. Tauri decides to codesign on APPLE_CERTIFICATE merely being set, and a
      # repository without the secret still renders it as "" — so the bundler runs
      # `security import` on an empty certificate and dies with "failed to import
      # keychain certificate". Export the signing variables only when there is a
      # certificate to import; otherwise the build stays ad-hoc signed as intended.
      - name: Configure Apple code signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret is configured, so this build is ad-hoc"
            echo "signed. Users will have to clear the quarantine attribute by hand —"
            echo "the release notes and the README both explain how."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            # Heredoc form, so a multi-line certificate survives the round trip.
            printf '%s<<__SIGNING_EOF__\n%s\n__SIGNING_EOF__\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Auto-Transcript ${{ env.TAG }}
          releaseBody: |
            See CHANGELOG.md for what changed.

            **macOS:** these builds are unsigned unless a signing certificate was
            configured. If macOS says the app "is damaged", it is not — that is Gatekeeper
            reacting to the missing signature. Run:

            ```
            xattr -dr com.apple.quarantine /Applications/Auto-Transcript.app
            ```

            **Models are not bundled.** The app downloads the model you choose on first run.
          # Every platform uploads into the same draft. Publishing is a separate job so a
          # half-finished release — Windows attached, macOS still building or failed — is
          # never visible on the releases page.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
